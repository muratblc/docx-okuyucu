<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>DOCX Okuyucu</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<style>
:root{--bg:#eceae4;--paper:#fdfcf9;--ink:#23272e;--muted:#6b707a;--line:#d6d3ca;--accent:#2f5d62;--accent-ink:#fff;--fs:18px;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#15171a;--paper:#1e2126;--ink:#e4e2dc;--muted:#9a9ea6;--line:#33373e;--accent:#7fb3b8;--accent-ink:#10181a;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#15171a;--paper:#1e2126;--ink:#e4e2dc;--muted:#9a9ea6;--line:#33373e;--accent:#7fb3b8;--accent-ink:#10181a;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 "Segoe UI",system-ui,-apple-system,sans-serif}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--paper);z-index:10}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding:10px 16px;background:var(--paper);border-bottom:1px solid var(--line)}
header h1{font-size:16px;margin:0 auto 0 0;font-weight:600}
button,label.btn{font:inherit;font-size:14px;padding:7px 12px;border:1px solid var(--line);background:transparent;color:var(--ink);border-radius:6px;cursor:pointer}
button:hover,label.btn:hover{border-color:var(--accent)}
button:focus-visible,label.btn:focus-within,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
label.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
input[type=file]{position:absolute;opacity:0;width:0;height:0}
input[type=search]{font:inherit;font-size:14px;padding:7px 10px;border:1px solid var(--line);border-radius:6px;background:var(--bg);color:var(--ink);width:150px}
main{display:flex;gap:24px;max-width:1100px;margin:0 auto;padding:24px 16px}
nav#toc{width:230px;flex:none;position:sticky;top:calc(70px + env(safe-area-inset-top,0px));align-self:flex-start;max-height:calc(100vh - 100px);overflow:auto;font-size:14px}
nav#toc a{display:block;padding:4px 8px;color:var(--muted);text-decoration:none;border-left:2px solid var(--line)}
nav#toc a:hover{color:var(--accent);border-color:var(--accent)}
nav#toc a.l2{padding-left:20px}nav#toc a.l3{padding-left:32px}
#doc{flex:1;min-width:0;background:var(--paper);border:1px solid var(--line);border-radius:4px;padding:48px 56px;font:var(--fs)/1.75 Georgia,"Times New Roman",serif;overflow-wrap:anywhere}
#doc h1,#doc h2,#doc h3,#doc h4{font-family:"Segoe UI",system-ui,sans-serif;line-height:1.3;margin:1.6em 0 .5em}
#doc h1{font-size:1.7em}#doc h2{font-size:1.4em}#doc h3{font-size:1.15em}
#doc p{margin:0 0 1em}
#doc img{max-width:100%;height:auto}
#doc table{border-collapse:collapse;display:block;overflow-x:auto;max-width:100%;margin:1em 0}
#doc td,#doc th{border:1px solid var(--line);padding:6px 10px;font-size:.9em}
#doc blockquote{margin:1em 0;padding-left:1em;border-left:3px solid var(--accent);color:var(--muted)}
mark{background:#f5d76e;color:#222;border-radius:2px}
#empty{text-align:center;padding:60px 20px;color:var(--muted)}
#empty strong{display:block;font-size:20px;color:var(--ink);margin-bottom:8px}
#drop{outline:2px dashed var(--accent);outline-offset:-10px}
#msg{font-size:13px;color:var(--muted);padding:0 16px;max-width:1100px;margin:8px auto 0}
@media (max-width:820px){nav#toc{display:none}#doc{padding:24px 18px}}
@media print{header,nav,#msg{display:none}body{background:#fff}#doc{border:0;padding:0}}
</style>
</head>
<body>
<header>
  <h1 id="title">DOCX Okuyucu</h1>
  <input type="search" id="q" placeholder="Belgede ara…" aria-label="Belgede ara">
  <button id="smaller" aria-label="Yazıyı küçült">A−</button>
  <button id="bigger" aria-label="Yazıyı büyüt">A+</button>
  <button id="theme">Tema</button>
  <button id="print">Yazdır</button>
  <label class="btn primary">Dosya aç<input type="file" id="file" accept=".docx"></label>
</header>
<div id="msg"></div>
<main>
  <nav id="toc" aria-label="İçindekiler"></nav>
  <article id="doc">
    <div id="empty"><strong>Bir .docx dosyası açın</strong>Dosyayı buraya sürükleyin ya da “Dosya aç” düğmesini kullanın. Dosya cihazınızdan çıkmaz; tarayıcıda okunur.</div>
  </article>
</main>
<script src="https://cdnjs.cloudflare.com/ajax/libs/mammoth/1.6.0/mammoth.browser.min.js"></script>
<script>
(function(){
  var doc=document.getElementById('doc'),toc=document.getElementById('toc'),msg=document.getElementById('msg'),
      root=document.documentElement,fs=18,original='';
  function say(t){msg.textContent=t||''}
  function setFs(n){fs=Math.max(13,Math.min(32,n));root.style.setProperty('--fs',fs+'px')}
  document.getElementById('bigger').onclick=function(){setFs(fs+2)};
  document.getElementById('smaller').onclick=function(){setFs(fs-2)};
  document.getElementById('print').onclick=function(){window.print()};
  document.getElementById('theme').onclick=function(){
    var dark=root.getAttribute('data-theme')?root.getAttribute('data-theme')==='dark':matchMedia('(prefers-color-scheme: dark)').matches;
    root.setAttribute('data-theme',dark?'light':'dark');
  };
  function buildToc(){
    toc.innerHTML='';
    doc.querySelectorAll('h1,h2,h3').forEach(function(h,i){
      if(!h.textContent.trim())return;
      h.id='b'+i;
      var a=document.createElement('a');
      a.href='#b'+i;a.textContent=h.textContent;a.className='l'+h.tagName[1];
      a.onclick=function(e){e.preventDefault();h.scrollIntoView({behavior:'smooth'})};
      toc.appendChild(a);
    });
  }
  function load(file){
    if(!file)return;
    if(!/\.docx$/i.test(file.name)){say('Yalnızca .docx dosyaları açılabilir.');return}
    say('Açılıyor…');
    var r=new FileReader();
    r.onload=function(){
      mammoth.convertToHtml({arrayBuffer:r.result}).then(function(res){
        doc.innerHTML=res.value||'<div id="empty">Belgede gösterilecek içerik bulunamadı.</div>';
        original=doc.innerHTML;
        document.getElementById('title').textContent=file.name;
        document.title=file.name;
        buildToc();
        say(res.messages.length?'Bazı biçimlendirmeler tam aktarılamadı ('+res.messages.length+' uyarı).':'');
        window.scrollTo(0,0);
      }).catch(function(){say('Dosya okunamadı. Bozuk ya da desteklenmeyen bir .docx olabilir.')});
    };
    r.readAsArrayBuffer(file);
  }
  if('launchQueue' in window){launchQueue.setConsumer(function(p){if(p.files&&p.files.length){p.files[0].getFile().then(load)}})}
  if('serviceWorker' in navigator){navigator.serviceWorker.register('sw.js').catch(function(){})}
  document.getElementById('file').onchange=function(e){load(e.target.files[0])};
  ['dragover','dragenter'].forEach(function(t){document.addEventListener(t,function(e){e.preventDefault();doc.id='doc';doc.classList.add('drag');document.body.style.outline='2px dashed var(--accent)';document.body.style.outlineOffset='-8px'})});
  ['dragleave','drop'].forEach(function(t){document.addEventListener(t,function(e){e.preventDefault();document.body.style.outline=''})});
  document.addEventListener('drop',function(e){load(e.dataTransfer.files[0])});
  document.getElementById('q').oninput=function(e){
    var v=e.target.value.trim();
    if(!original)return;
    doc.innerHTML=original;
    if(v.length<2){buildToc();return}
    var re=new RegExp(v.replace(/[.*+?^${}()|[\]\\]/g,'\\$&'),'gi'),first=null;
    var w=document.createTreeWalker(doc,NodeFilter.SHOW_TEXT),nodes=[],n;
    while(n=w.nextNode())nodes.push(n);
    nodes.forEach(function(t){
      if(!re.test(t.nodeValue))return;re.lastIndex=0;
      var s=document.createElement('span');
      s.innerHTML=t.nodeValue.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(re,function(m){return '<mark>'+m+'</mark>'});
      t.parentNode.replaceChild(s,t);
    });
    first=doc.querySelector('mark');
    var c=doc.querySelectorAll('mark').length;
    say(c?c+' sonuç bulundu.':'Sonuç bulunamadı.');
    if(first)first.scrollIntoView({block:'center'});
    buildToc();
  };
})();
</script>
</body>
</html>
